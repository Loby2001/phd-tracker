name: Controllo bandi dottorato

on:
  schedule:
    # Ogni 6 ore. Orari UTC: 00:00, 06:00, 12:00, 18:00.
    - cron: "0 */3 * * *"
  workflow_dispatch: {}   # bottone "Run workflow" per testare manualmente

permissions:
  contents: write

concurrency:
  group: phd-tracker-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run check script
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: npm run check

      - name: Commit updated data (se cambiata)
        run: |
          git config user.name "phd-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nessuna modifica ai dati, niente da committare."
          else
            git commit -m "Aggiorna elenco offerte di dottorato [skip ci]"
            git push
          fi
